[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "stay-seated"
version = "0.1.0"
description = "Stay Seated: seated locomotion of a humanoid on a rolling stool, built on mjlab."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mjlab==1.5.2",
  "mujoco==3.10.0",
  "mujoco-warp==3.10.0.2",
  "warp-lang==1.14.0",
  "torch>=2.7.0",
  # rsl-rl-lib 5.4.0 passes wandb.Settings(start_method=...), which newer wandb rejects.
  "wandb==0.27.0",
]

# Registers the task with mjlab, so mjlab's `train` / `play` commands find it.
[project.entry-points."mjlab.tasks"]
stay_seated = "stay_seated.tasks"

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[tool.ruff]
src = ["src"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
